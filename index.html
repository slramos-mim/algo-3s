<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo 3S</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans italic font-black leading-relaxed">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        // Dynamic Lucide helper since we aren't using ES imports
        const Icon = ({ name, size = 16, className = "" }) => {
            if (!window.lucide || !window.lucide.icons) return null;
            const IconComponent = window.lucide.icons[name];
            return IconComponent ? <IconComponent size={size} className={className} /> : null;
        };

        const STEP_NAMES = { 1: "TRIAGEM", 2: "STOP", 3: "SWITCH", 4: "START", 5: "CONCLUIR" };
        const STEP_SUBTITLES = {
            1: "Elegibilidade e Objetivo Clínico",
            2: "Fármacos a considerar a descontinuação (PIMs)",
            3: "Fármacos a considerar a substituição terapêutica",
            4: "Fármacos a considerar a introdução / Omissões (PPOs)"
        };
        const STEP_COLORS = { 1: "text-indigo-600", 2: "text-orange-600", 3: "text-blue-600", 4: "text-purple-500", 5: "text-emerald-700" };
        const STEP_BG_COLORS = { 1: "bg-indigo-600", 2: "bg-orange-600", 3: "bg-blue-600", 4: "bg-purple-500", 5: "bg-emerald-700" };

        const getLoeColor = (loe) => {
            if (loe === 'A') return "bg-indigo-950 text-white font-black";
            if (loe === 'B') return "bg-indigo-500 text-white font-black";
            return "bg-slate-400 text-white font-black";
        };

        function App() {
            const [step, setStep] = useState(1);
            const [modal, setModal] = useState(null);

            const abbreviations = useMemo(() => [
                { s: "PIMs", e: "Medicamentos Potencialmente Inapropriados" },
                { s: "PPOs", e: "Omissões de Prescrição Potencialmente Inapropriadas" },
                { s: "IBPs", e: "Inibidores da Bomba de Protões" },
                { s: "DOACs", e: "Anticoagulantes Orais Diretos" },
                { s: "AVK", e: "Antagonistas da Vitamina K" },
                { s: "ACB", e: "Carga Anticolinérgica" },
                { s: "TFG", e: "Taxa de Filtração Glomerular" },
                { s: "AINEs", e: "Anti-inflamatórios Não Esteroides" }
            ], []);

            const content = useMemo(() => ({
                stoppstart: {
                    title: "Resumo STOPP/START v3",
                    subtitle: "Visão integrada das recomendações europeias atualizadas.",
                    color: "bg-indigo-950",
                    sections: [
                        {
                            heading: "STOP (Considerar Descontinuar)",
                            items: [
                                { class: "Anticolinérgicos", drug: "Oxibutinina, Tolterodina, Solifenacina", rationale: "Elevado risco de delirium, quedas e retenção urinária aguda.", loe: "A" },
                                { class: "Benzodiazepinas", drug: "Alprazolam, Lorazepam, Diazepam", rationale: "Risco maior de quedas, fraturas e compromisso cognitivo severo.", loe: "A" },
                                { class: "IBPs (Uso Crónico)", drug: "Omeprazol, Pantoprazol, Lansoprazol", rationale: "Uso > 8 semanas sem indicação clara; risco de hipomagnesémia.", loe: "B" }
                            ]
                        },
                        {
                            heading: "START (Considerar Iniciar)",
                            items: [
                                { class: "Classe: DOACs", drug: "Apixabano, Edoxabano, Rivaroxabano", rationale: "Prevenção de AVC na FA não valvular. Note: Use Varfarina apenas em válvulas.", loe: "A" },
                                { class: "Classe: iSGLT2", drug: "Dapagliflozina, Empagliflozina", rationale: "Benefício robusto na IC-FEr; benefício emergente na IC-FEp.", loe: "A" }
                            ]
                        }
                    ],
                    biblio: "Fonte: O’Mahony D, et al. STOPP/START criteria version 3 (2023)."
                },
                stop: {
                    title: "Critérios STOP",
                    subtitle: STEP_SUBTITLES[2],
                    color: "bg-orange-600", itemBg: "bg-orange-50", itemBorder: "border-orange-100",
                    items: [
                        { class: "Anticolinérgicos Urinários", drug: "Oxibutinina, Tolterodina, Solifenacina", rationale: "Racional: Elevada carga anticolinérgica (ACB). Risco de delirium e quedas.", loe: "A" },
                        { class: "Antiespasmódicos GI", drug: "Butilescopolamina (Efeito Central Major)", rationale: "Racional: Perfil antimuscarínico central potente e perigoso no idoso.", loe: "A" },
                        { class: "Benzodiazepinas", drug: "Alprazolam, Lorazepam, Diazepam", rationale: "Racional: Sedação excessiva, risco maior de fraturas e declínio cognitivo.", loe: "A" },
                        { class: "IBPs (Sem indicação)", drug: "Omeprazol, Pantoprazol, Lansoprazol", rationale: "Racional: Risco de C. difficile e fraturas em uso prolongado (>8 sem).", loe: "B" },
                        { class: "AINEs (Uso Crónico)", drug: "Naproxeno, Ibuprofeno, Diclofenac", rationale: "Racional: Risco hemorrágico GI e renal (Contexto: IC, DRC, HTA).", loe: "B" },
                        { class: "Sulfonilureias Longa Duração", drug: "Glibenclamida, Clorpropamida", rationale: "Racional: Risco muito elevado de hipoglicemias graves e prolongadas.", loe: "A" }
                    ],
                    biblio: "Referência: STOPP/START criteria version 3 (2023)."
                },
                switch: {
                    title: "Estratégia SWITCH",
                    subtitle: STEP_SUBTITLES[3],
                    color: "bg-blue-600", itemBg: "bg-blue-50", itemBorder: "border-blue-100",
                    items: [
                        { evaluate: "Hidroxizina, Clemastina ou Difenidramina", evaluateClass: "Classe: Anti-histamínicos de 1.ª Geração", targetClass: "Substituir por: Anti-histamínicos de 2.ª Geração", examples: "Cetirizina, Loratadina, Desloratadina", rationale: "Racional: Reduzir carga anticolinérgica (ACB) e sedação profunda.", loe: "A" },
                        { evaluate: "Glibenclamida ou Clorpropamida", evaluateClass: "Classe: Sulfonilureias de longa duração", targetClass: "Substituir por: Biguanidas / iDPP4", examples: "Metformina, Sitagliptina, Vildagliptina", rationale: "Racional: Prevenir hipoglicemias graves e quedas.", loe: "A" },
                        { evaluate: "Amitriptilina ou Clomipramina", evaluateClass: "Classe: Antidepressivos Tricíclicos", targetClass: "Substituir por: ISRS (Perfil Seguro)", examples: "Sertralina, Escitalopram (Evitar Paroxetina)", rationale: "Racional: Evitar toxicidade cardíaca e efeitos anticolinérgicos.", loe: "B" }
                    ],
                    biblio: "Fontes: Mendes et al. (2018) e Critérios STOPP/START v3."
                },
                start: {
                    title: "Critérios START",
                    subtitle: STEP_SUBTITLES[4],
                    color: "bg-purple-500", itemBg: "bg-purple-50", itemBorder: "border-purple-100",
                    items: [
                        { class: "Classe: Anticoagulantes (DOACs)", drug: "Apixabano, Edoxabano, Rivaroxabano", rationale: "Racional: Prevenção AVC na FA. Use Varfarina apenas em válvulas mecânicas.", loe: "A" },
                        { class: "Classe: iSGLT2 (Gliflozinas)", drug: "Dapagliflozina, Empagliflozina", rationale: "Racional: Benefício robusto na IC-FEr; benefício emergente na IC-FEp.", loe: "A" },
                        { class: "Classe: Bisfosfonatos", drug: "Ácido Alendrónico, Risedronato, Ibandronato", rationale: "Racional: Prevenção secundária de fraturas em osteoporose.", loe: "A" },
                        { class: "Classe: Estatinas", drug: "Atorvastatina, Rosuvastatina, Simvastatina", rationale: "Racional: Prevenção secundária em doença vascular aterosclerótica.", loe: "A" }
                    ],
                    biblio: "Referência: STOPP/START criteria version 3 (2023)."
                },
                beers: {
                    title: "Critérios Beers 2023",
                    subtitle: "Medicamentos potencialmente inapropriados segundo a AGS.",
                    color: "bg-amber-600", itemBg: "bg-amber-50", itemBorder: "border-amber-100",
                    items: [
                        { class: "Classe: Antiagregantes", drug: "AAS (Aspirina), Clopidogrel", rationale: "Racional: Considerar cautela em prevenção primária (>75 anos) pelo risco hemorrágico.", loe: "A" },
                        { class: "Classe: Anticoagulantes", drug: "Rivaroxabano, Edoxabano", rationale: "Racional: Risco hemorrágico GI aumentado face ao Apixabano no idoso.", loe: "B" },
                        { class: "Classe: Antipsicóticos", drug: "Risperidona, Olanzapina, Quetiapina", rationale: "Racional: Aumento do risco de AVC e mortalidade em idosos com demência.", loe: "A" },
                        { class: "Classe: Hipnóticos (Z-Drugs)", drug: "Zolpidem, Zopiclona, Eszopiclona", rationale: "Racional: Risco elevado de quedas, fraturas e delirium.", loe: "A" },
                        { class: "Classe: Sulfonilureias", drug: "Glibenclamida, Glimepirida", rationale: "Racional: Elevado risco de hipoglicemia grave e prolongada.", loe: "A" }
                    ],
                    biblio: "Fonte: AGS Beers Criteria® Update (2023)."
                },
                fontes: {
                    title: "Fontes e Referências",
                    subtitle: "Bases científicas e normas de orientação clínica.",
                    color: "bg-slate-900",
                    refs: [
                        { name: "STOPP/START v3 (2023)", link: "https://doi.org/10.1007/s41999-023-00777-y" },
                        { name: "AGS Beers Criteria® (2023)", link: "https://doi.org/10.1111/jgs.18372" },
                        { name: "Mendes et al. (2018)", link: "https://doi.org/10.1016/j.regg.2018.04.444" },
                        { name: "DGS - NOC Polifarmácia", link: "https://www.dgs.pt" }
                    ]
                }
            }), []);

            const nextStep = () => {
                setStep(s => {
                    const n = Math.min(s + 1, 5);
                    setModal(null);
                    return n;
                });
            };
            
            const reset = () => { setStep(1); setModal(null); };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans italic font-black leading-relaxed">
                    <nav class="w-full max-w-xl mx-auto bg-white border-b-4 border-indigo-950 sticky top-0 z-50 px-5 py-3 shadow-xl">
                        <div class="flex flex-col gap-3 mb-5 font-black">
                            <div class="flex items-center justify-between">
                                <div class="flex flex-col leading-none shrink-0 font-black">
                                    <p class="text-[9px] text-indigo-600 font-black tracking-widest uppercase italic leading-none">FMCB.UALG</p>
                                    <p class="text-[13px] text-slate-800 font-black underline decoration-indigo-200 mt-1 leading-none">Sílvia Ramos</p>
                                </div>
                                <div class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 flex items-center gap-1.5 shadow-sm shrink-0">
                                    <Icon name="Stethoscope" size={14} className="text-indigo-600" />
                                    <span class="text-[8px] uppercase tracking-tighter font-black">Apoio Decisão</span>
                                </div>
                            </div>
                            <div class="w-full bg-indigo-950 text-white px-6 py-3 rounded-xl shadow-2xl border-l-4 border-indigo-500 text-center font-black">
                                <h1 class="text-xl font-black uppercase tracking-tighter leading-none italic">Algoritmo 3S</h1>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-1.5 text-center font-black">
                            <button onClick={() => setModal("stoppstart")} class="flex flex-col items-center gap-1 p-1.5 bg-indigo-50 border border-indigo-100 rounded-lg shadow-sm transition active:scale-95">
                                <Icon name="BookOpen" size={12} className="text-indigo-600" />
                                <span class="text-[7px] uppercase tracking-tighter font-black">STOPP/START</span>
                            </button>
                            <button onClick={() => setModal("beers")} class="flex flex-col items-center gap-1 p-1.5 bg-amber-50 border border-amber-100 rounded-lg shadow-sm transition active:scale-95">
                                <Icon name="FileText" size={12} className="text-amber-600" />
                                <span class="text-[7px] uppercase tracking-tighter font-black">Beers 2023</span>
                            </button>
                            <button onClick={() => setModal("fontes")} class="flex flex-col items-center gap-1 p-1.5 bg-emerald-50 border border-emerald-100 rounded-lg shadow-sm transition active:scale-95">
                                <Icon name="ExternalLink" size={12} className="text-emerald-700" />
                                <span class="text-[7px] uppercase tracking-tighter font-black">Referências</span>
                            </button>
                            <button onClick={() => setModal("abbrev")} class="flex flex-col items-center gap-1 p-1.5 bg-slate-100 border border-slate-200 rounded-lg shadow-sm transition active:scale-95">
                                <Icon name="Hash" size={12} className="text-slate-600" />
                                <span class="text-[7px] uppercase tracking-tighter font-black">Siglas</span>
                            </button>
                        </div>

                        <div class="mt-6 px-1 font-black">
                            <div class="flex gap-1.5 font-black">
                                {[1, 2, 3, 4, 5].map(i => (
                                    <div key={i} class={`h-1.5 rounded-full flex-1 transition-all duration-700 ${i <= step ? STEP_BG_COLORS[i] : "bg-slate-200"}`} />
                                ))}
                            </div>
                            <div class="grid grid-cols-5 mt-2.5 text-[6px] text-slate-400 uppercase tracking-widest font-black italic">
                                {Object.entries(STEP_NAMES).map(([key, name]) => (
                                    <div key={key} class={`text-center transition-all ${Number(key) === step ? "text-slate-950 font-black scale-105" : ""}`}>
                                        {key} {name}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main class="w-full max-w-xl mx-auto p-5 pb-20 font-black italic">
                        {step < 5 && (
                            <div class="flex flex-col items-center">
                                <div class="mb-10 text-center font-black">
                                    <span class="text-xl font-black text-slate-900 uppercase tracking-[0.3em] mb-2 block italic opacity-70">PASSO {step}</span>
                                    <h2 class={`text-6xl leading-none font-black italic uppercase tracking-tighter ${STEP_COLORS[step]}`}>
                                        {STEP_NAMES[step]}
                                    </h2>
                                    <p class={`text-base font-black italic uppercase tracking-tight mt-2 ${STEP_COLORS[step]} opacity-80`}>
                                        {STEP_SUBTITLES[step]}
                                    </p>
                                </div>

                                <div class={`bg-white rounded-[2.5rem] p-10 border-l-[16px] shadow-2xl w-full relative border-${STEP_BG_COLORS[step].split('-')[1]}-600 font-black`}>
                                    <div class="space-y-6 mb-10">
                                        {step === 1 ? (
                                            <div class="space-y-6">
                                                <p class="text-slate-700 text-sm leading-relaxed">
                                                    O objetivo deste algoritmo é apoiar a revisão da medicação no idoso, identificando potenciais riscos e otimizando a segurança farmacoterapêutica através dos critérios STOPP/START e Beers.
                                                </p>
                                                <div class="space-y-3 pt-2">
                                                    {["Idade ≥ 65 anos", "Polifarmácia (≥ 5 fármacos diários)", "Risco de Quedas ou Fragilidade"].map((t, idx) => (
                                                        <div key={idx} class="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                            <span class="text-indigo-600 text-lg font-black">{idx + 1}.</span>
                                                            <span class="text-[12px] font-bold">{t}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ) : (
                                            <div class="py-2">
                                                <button onClick={() => setModal(STEP_NAMES[step].toLowerCase())} class={`w-full text-white py-8 rounded-3xl text-[15px] font-black uppercase shadow-xl flex items-center justify-center gap-3 transition-all hover:brightness-110 active:scale-95 border-b-4 border-black/10 ${STEP_BG_COLORS[step]}`}>
                                                    <Icon name="List" size={24} /> Consultar Recomendações Clínicas
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    
                                    <button onClick={nextStep} class={`w-full py-4 rounded-xl text-white font-black uppercase shadow-lg active:scale-95 transition-all flex flex-col items-center justify-center gap-0 tracking-widest ${STEP_BG_COLORS[step + 1] || 'bg-slate-900'} opacity-90`}>
                                        <span class="text-[8px] font-black uppercase opacity-70 tracking-tighter leading-none mb-0.5">Avançar para passo {step + 1}</span>
                                        <span class="text-xl font-black uppercase leading-tight">{STEP_NAMES[step + 1]}</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {step === 5 && (
                            <div class="text-center flex flex-col items-center">
                                <div class="bg-emerald-50 p-8 rounded-full mb-6 border-2 border-emerald-100 shadow-inner">
                                    <Icon name="CheckCircle" size={60} className="text-emerald-700" />
                                </div>
                                <h2 class="text-4xl font-black text-slate-900 uppercase italic mb-10 tracking-tighter underline decoration-emerald-700 decoration-4 underline-offset-4">Revisão Concluída</h2>
                                <div class="w-full space-y-6 text-left font-black">
                                    <div class="bg-amber-50 border-l-4 border-amber-400 p-6 rounded-xl shadow-sm mb-6 flex items-start gap-4">
                                        <Icon name="AlertTriangle" size={24} className="text-amber-500 shrink-0" />
                                        <p class="text-[12px] text-amber-900 leading-snug">
                                            <strong>JUÍZO CLÍNICO:</strong> A decisão clínica baseada no juízo de valor do profissional prevalece sobre as recomendações deste algoritmo, devendo ser individualizada.
                                        </p>
                                    </div>
                                    <div class="p-10 bg-white rounded-[3rem] border-4 border-emerald-50 shadow-2xl relative">
                                        <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-6 italic">Plano de Seguimento:</p>
                                        <div class="space-y-6 text-[14px] text-slate-700 italic font-black">
                                            <div class="flex gap-5 items-start">
                                                <div class="p-3 bg-emerald-50 rounded-lg text-emerald-700 shrink-0"><Icon name="ClipboardCheck" size={20} /></div>
                                                <div>
                                                    <p class="font-black text-slate-900 uppercase text-[11px] tracking-tight leading-none">Registo Clínico</p>
                                                    <p class="text-[12px] text-slate-500 mt-1 leading-snug">Documentar intervenções e fundamentar as alterações terapêuticas.</p>
                                                </div>
                                            </div>
                                            <div class="flex gap-5 items-start">
                                                <div class="p-3 bg-emerald-50 rounded-lg text-emerald-700 shrink-0"><Icon name="RefreshCw" size={20} /></div>
                                                <div>
                                                    <p class="font-black text-slate-900 uppercase text-[11px] tracking-tight leading-none">Monitorização</p>
                                                    <p class="text-[12px] text-slate-500 mt-1 leading-snug">Avaliar eficácia e segurança em consulta de follow-up.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={reset} class="w-full mt-10 bg-indigo-950 text-white py-7 rounded-2xl font-black uppercase shadow-2xl flex items-center justify-center gap-4 active:scale-95 transition-all">
                                    Iniciar Novo Utente <Icon name="RefreshCw" size={18} />
                                </button>
                            </div>
                        )}
                    </main>

                    {modal && (
                        <div class="fixed inset-0 z-[100] flex flex-col justify-end p-4 bg-black/50 backdrop-blur-md italic font-black">
                            <div class="bg-white w-full max-w-xl mx-auto rounded-[3rem] overflow-hidden flex flex-col shadow-2xl border border-slate-200">
                                <div class={["p-6 text-white flex items-center justify-between", modal === "abbrev" || modal === "fontes" ? "bg-slate-900" : (content[modal]?.color || "bg-indigo-950")].join(" ")}>
                                    <div class="flex flex-col gap-0.5">
                                        <div class="flex items-center gap-3">
                                            <div class="p-1.5 bg-white/20 rounded-lg"><Icon name="Info" size={20} /></div>
                                            <h3 class="font-black uppercase text-xl tracking-tight italic">{content[modal]?.title || "Detalhes"}</h3>
                                        </div>
                                        {content[modal]?.subtitle && (
                                            <p class="text-[9px] text-white/80 uppercase tracking-widest font-black italic mt-1 leading-none">
                                                {content[modal].subtitle}
                                            </p>
                                        )}
                                    </div>
                                    <button onClick={() => setModal(null)} class="p-2 bg-black/20 hover:bg-white/20 rounded-xl transition"><Icon name="PlusCircle" className="w-7 h-7 rotate-45" /></button>
                                </div>
                                
                                <div class="p-10 space-y-6 max-h-[60vh] overflow-y-auto bg-slate-50">
                                    {modal === "abbrev" && abbreviations.map(a => (
                                        <div key={a.s} class="flex gap-6 text-[12px] bg-white p-5 rounded-2xl border border-slate-100 shadow-sm"><span class="text-indigo-600 w-20 uppercase font-black shrink-0"> {a.s}</span><span class="text-slate-500 font-bold">{a.e}</span></div>
                                    ))}

                                    {modal === "fontes" && content.fontes.refs.map(b => (
                                        <div key={b.name} class="p-4 bg-white border border-slate-200 rounded-2xl flex items-center justify-between shadow-sm mb-3 last:mb-0">
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 bg-indigo-50 text-indigo-700 rounded-lg flex items-center justify-center text-[9px] font-black border border-indigo-100 italic">REF</div>
                                                <div>
                                                    <p class="text-[10px] text-slate-800 font-black uppercase tracking-tight">{b.name}</p>
                                                </div>
                                            </div>
                                            <a href={b.link} target="_blank" class="p-2 bg-indigo-950 text-white rounded-lg shadow-lg"><Icon name="ExternalLink" size={14} /></a>
                                        </div>
                                    ))}

                                    {modal === "switch" && content.switch.items.map((item, idx) => (
                                        <div key={idx} class="bg-white rounded-[2rem] border-2 border-blue-100 shadow-md overflow-hidden mb-6 last:mb-0">
                                            <div class="bg-orange-50 p-6 border-b-2 border-orange-100">
                                                <span class="text-[10px] uppercase text-orange-600 font-black block mb-1 tracking-widest italic">Fármaco a avaliar:</span>
                                                <p class="text-lg text-orange-700 font-black uppercase leading-tight">{item.evaluate}</p>
                                                <p class="text-[12px] text-orange-800 font-black uppercase italic mt-1">{item.evaluateClass}</p>
                                            </div>
                                            <div class="p-6 space-y-5">
                                                <div>
                                                    <span class="text-[10px] uppercase text-indigo-400 font-black block mb-1 tracking-widest italic">Substituir por:</span>
                                                    <p class="text-[16px] text-indigo-950 font-black uppercase leading-tight">{item.targetClass}</p>
                                                </div>
                                                <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                                                    <span class="text-[10px] uppercase text-indigo-600 font-black block mb-2 italic">Sugestões DCI (Perfis Seguros):</span>
                                                    <p class="text-[14px] text-indigo-800 font-black italic tracking-tight">{item.examples}</p>
                                                </div>
                                                <p class="text-[12px] text-slate-600 leading-snug">Racional: {item.rationale}</p>
                                            </div>
                                        </div>
                                    ))}

                                    {modal !== "switch" && modal !== "fontes" && modal !== "abbrev" && modal !== "stoppstart" && content[modal]?.items?.map((item, idx) => (
                                        <div key={idx} class={["p-6 rounded-2xl border-2 shadow-sm relative mb-5 last:mb-0", `${content[modal].itemBg} ${content[modal].itemBorder}`].join(" ")}>
                                            <div class="flex justify-between items-start mb-4">
                                                <p class="font-black text-indigo-950 text-sm uppercase underline decoration-indigo-200 decoration-4 underline-offset-4">{item.class}</p>
                                                <span class={`text-[8px] font-black px-2 py-1 rounded-lg uppercase italic ${getLoeColor(item.loe)}`}>Nível de Evidência {item.loe}</span>
                                            </div>
                                            <div class="mb-4">
                                                <p class="text-[14px] text-indigo-700 font-black italic bg-indigo-50/50 p-3 rounded-lg border border-indigo-100/50 tracking-tight leading-snug">DCIs: {item.drug}</p>
                                            </div>
                                            <p class="text-[12px] text-slate-600 italic leading-snug">Racional: {item.rationale}</p>
                                        </div>
                                    ))}

                                    {modal === "stoppstart" && content.stoppstart.sections.map((sec, sidx) => (
                                        <div key={sidx} class="space-y-4 pt-4 first:pt-0 mb-8 last:mb-0">
                                            <h5 class="text-sm font-black text-indigo-950 uppercase tracking-widest border-b-2 border-indigo-100 pb-2 mb-4 italic"> {sec.heading}</h5>
                                            {sec.items.map((item, idx) => (
                                                <div key={idx} class="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm relative mb-3 last:mb-0">
                                                    <div class={`absolute top-4 right-4 text-[7px] font-black px-2 py-1 rounded-lg uppercase italic ${getLoeColor(item.loe)}`}>Nível de Evidência {item.loe}</div>
                                                    <p class="text-sm text-indigo-950 font-black uppercase mb-1">{item.class}</p>
                                                    <p class="text-[11px] text-indigo-600 italic mb-2 tracking-tight">DCIs: {item.drug}</p>
                                                    <p class="text-[11px] text-slate-500 leading-tight font-bold">Racional: {item.rationale}</p>
                                                </div>
                                            ))}
                                        </div>
                                    ))}

                                    {content[modal]?.biblio && (
                                        <div class="mt-8 pt-6 border-t-2 border-slate-200">
                                            <p class="text-[8px] uppercase text-slate-400 font-black tracking-widest mb-3 italic">Fonte de Evidência:</p>
                                            <div class="p-5 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-2">
                                                <p class="text-[11px] text-slate-800 font-black italic leading-tight">{content[modal].biblio}</p>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div class="p-8 bg-slate-50 border-t flex flex-col gap-3">
                                    {step < 5 && modal !== "stoppstart" && modal !== "fontes" && modal !== "abbrev" && (
                                        <button onClick={nextStep} class={`w-full text-white py-5 rounded-2xl uppercase text-[12px] shadow-lg flex items-center justify-center gap-2 transition active:scale-95 ${STEP_BG_COLORS[step + 1] || 'bg-slate-900'}`}>
                                            Próximo Passo: {STEP_NAMES[step + 1]} <Icon name="ArrowRight" size={16} />
                                        </button>
                                    )}
                                    <button onClick={() => setModal(null)} class="w-full bg-slate-200 text-slate-600 font-black py-4 rounded-xl uppercase text-[10px] tracking-widest shadow-sm italic transition hover:bg-slate-300">Fechar Detalhes</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Initialize and Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
