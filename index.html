<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo 3S</title>
    <meta name="robots" content="noindex, nofollow, noimageindex, noarchive, nosnippet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js" crossorigin></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans italic font-black leading-relaxed">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;
        
        // Native SVG mapping of exact Lucide icons used to guarantee zero dependency loading failure
        const CheckCircle = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg>
        );
        const ExternalLink = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
        );
        const Info = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="16" y2="12" /><line x1="12" x2="12.01" y1="8" y2="8" /></svg>
        );
        const List = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="8" x2="21" y1="6" y2="6" /><line x1="8" x2="21" y1="12" y2="12" /><line x1="8" x2="21" y1="18" y2="18" /><line x1="3" x2="3.01" y1="6" y2="6" /><line x1="3" x2="3.01" y1="12" y2="12" /><line x1="3" x2="3.01" y1="18" y2="18" /></svg>
        );
        const PlusCircle = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="8" x2="16" y1="12" y2="12" /><line x1="12" x2="12" y1="8" y2="16" /></svg>
        );
        const BookOpen = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>
        );
        const ClipboardCheck = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></svg>
        );
        const Hash = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="9" y2="9" /><line x1="4" x2="20" y1="15" y2="15" /><line x1="10" x2="8" y1="3" y2="21" /><line x1="16" x2="14" y1="3" y2="21" /></svg>
        );
        const FileText = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><line x1="10" x2="8" y1="9" y2="9" /><line x1="16" x2="8" y1="13" y2="13" /><line x1="16" x2="8" y1="17" y2="17" /></svg>
        );
        const RefreshCw = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M3 21v-5h5" /></svg>
        );
        const Stethoscope = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3" /><path d="M8 15v4a3 3 0 0 0 3 3h2a3 3 0 0 0 3-3v-5" /><circle cx="16" cy="10" r="2" /></svg>
        );
        const AlertTriangle = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" x2="12" y1="9" y2="13" /><line x1="12" x2="12.01" y1="17" y2="17" /></svg>
        );
        const ArrowRight = ({ size = 16, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" x2="19" y1="12" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
        );

        const STEP_NAMES = {
          1: "TRIAGEM",
          2: "STOP",
          3: "SWITCH",
          4: "START",
          5: "CONCLUIR"
        };

        const STEP_SUBTITLES = {
          1: "Elegibilidade e Objetivo Clínico",
          2: "Fármacos a considerar a descontinuação (PIMs)",
          3: "Fármacos a considerar a substituição terapêutica",
          4: "Fármacos a considerar a introdução / Omissões (PPOs)"
        };

        const STEP_COLORS = {
          1: "text-indigo-600",
          2: "text-orange-600",
          3: "text-blue-600",
          4: "text-purple-500",
          5: "text-emerald-700"
        };

        const STEP_BG_COLORS = {
          1: "bg-indigo-600",
          2: "bg-orange-600",
          3: "bg-blue-600",
          4: "bg-purple-500",
          5: "bg-emerald-700"
        };

        const getLoeColor = (loe) => {
          if (loe === 'A') return "bg-indigo-950 text-white font-black";
          if (loe === 'B') return "bg-indigo-500 text-white font-black";
          return "bg-slate-400 text-white font-black";
        };

        function App() {
          const [step, setStep] = useState(1);
          const [modal, setModal] = useState(null); 

          const abbreviations = useMemo(() => [
            { s: "PIMs", e: "Medicamentos Potencialmente Inapropriados" },
            { s: "PPOs", e: "Omissões de Prescrição Potencialmente Inapropriadas" },
            { s: "IBPs", e: "Inibidores da Bomba de Protões" },
            { s: "DOACs", e: "Anticoagulantes Orais Diretos" },
            { s: "AVK", e: "Antagonistas da Vitamina K" },
            { s: "ACB", e: "Carga Anticolinérgica (Anticholinergic Cognitive Burden)" },
            { s: "TFG", e: "Taxa de Filtração Glomerular" },
            { s: "AINEs", e: "Anti-inflamatórios Não Esteroides" }
          ], []);

          const content = useMemo(() => ({
            stoppstart: {
              title: "Resumo STOPP/START v3",
              subtitle: "Visão integrada das recomendações europeias atualizadas.",
              color: "bg-indigo-950",
              sections: [
                {
                  heading: "STOP (Considerar Descontinuar)",
                  items: [
                    { class: "Anticolinérgicos", drug: "Oxibutinina, Tolterodina, Solifenacina", rationale: "Elevado risco de delirium, quedas e retenção urinária aguda.", loe: "A" },
                    { class: "Benzodiazepinas", drug: "Alprazolam, Lorazepam, Diazepam", rationale: "Risco maior de quedas, fraturas e compromisso cognitivo severo.", loe: "A" },
                    { class: "IBPs (Uso Crónico)", drug: "Omeprazol, Pantoprazol, Lansoprazol", rationale: "Uso > 8 semanas sem indicação clara; risco de hipomagnesémia.", loe: "B" }
                  ]
                },
                {
                  heading: "START (Considerar Iniciar)",
                  items: [
                    { class: "Classe: DOACs", drug: "Apixabano, Edoxabano, Rivaroxabano", rationale: "Prevenção de AVC na FA não valvular. Note: Use Varfarina apenas em válvulas.", loe: "A" },
                    { class: "Classe: iSGLT2", drug: "Dapagliflozina, Empagliflozina", rationale: "Benefício robusto na IC-FEr; benefício emergente na IC-FEp.", loe: "A" }
                  ]
                }
              ],
              biblio: "Fonte: O’Mahony D, et al. STOPP/START criteria version 3 (2023)."
            },
            stop: {
              title: "Conduta STOP",
              subtitle: STEP_SUBTITLES[2],
              color: "bg-orange-600",
              itemBg: "bg-orange-50",
              itemBorder: "border-orange-100",
              items: [
                { class: "Anticolinérgicos Urinários", drug: "Oxibutinina, Tolterodina, Solifenacina", rationale: "Elevada carga anticolinérgica (ACB). Risco de delirium e quedas.", loe: "A" },
                { class: "Antiespasmódicos GI", drug: "Butilescopolamina (Efeito Central Major)", rationale: "Perfil antimuscarínico central potente e perigoso no idoso.", loe: "A" },
                { class: "Benzodiazepinas", drug: "Alprazolam, Lorazepam, Diazepam", rationale: "Sedação excessiva, risco maior de fraturas e declínio cognitivo.", loe: "A" },
                { class: "IBPs (Uso prolongado)", drug: "Omeprazol, Pantoprazol, Lansoprazol", rationale: "Risco de C. difficile e fraturas em uso prolongado (>8 sem).", loe: "B" },
                { class: "AINEs (Uso Crónico)", drug: "Naproxeno, Ibuprofeno, Diclofenac", rationale: "Risco hemorrágico GI e renal (Contexto: IC, DRC, HTA).", loe: "B" },
                { class: "Sulfonilureias Longa Duração", drug: "Glibenclamida, Glimepirida", rationale: "Risco muito elevado de hipoglicemias graves e prolongadas.", loe: "A" }
              ],
              biblio: "Referência: STOPP/START criteria version 3 (2023)."
            },
            switch: {
              title: "Estratégia SWITCH",
              subtitle: STEP_SUBTITLES[3],
              color: "bg-blue-600",
              itemBg: "bg-blue-50",
              itemBorder: "border-blue-100",
              items: [
                { 
                  evaluate: "Hidroxizina, Clemastina ou Difenidramina", 
                  evaluateClass: "Classe: Anti-histamínicos de 1.ª Geração",
                  targetClass: "Substituir por: Anti-histamínicos de 2.ª Geração", 
                  examples: "Cetirizina, Loratadina, Desloratadina",
                  rationale: "Reduzir carga anticolinérgica (ACB) e sedação profunda.", 
                  loe: "A" 
                },
                { 
                  evaluate: "Glibenclamida ou Glimepirida", 
                  evaluateClass: "Classe: Sulfonilureias de longa duração",
                  targetClass: "Substituir por: Biguanidas / iDPP4", 
                  examples: "Metformina / Sitagliptina, Vildagliptina",
                  rationale: "Prevenir hipoglicemias graves e quedas.", 
                  loe: "A" 
                },
                { 
                  evaluate: "Amitriptilina ou Clomipramina", 
                  evaluateClass: "Classe: Antidepressivos Tricíclicos",
                  targetClass: "Substituir por: ISRS (Perfil Seguro)", 
                  examples: "Sertralina, Escitalopram (Evitar Paroxetina)",
                  rationale: "Evitar toxicidade cardíaca e efeitos anticolinérgicos.", 
                  loe: "B" 
                }
              ],
              biblio: "Fontes: Simões et al. (2018) e Critérios STOPP/START v3."
            },
            start: {
              title: "Conduta START",
              subtitle: STEP_SUBTITLES[4],
              color: "bg-purple-500",
              itemBg: "bg-purple-50",
              itemBorder: "border-purple-100",
              items: [
                { class: "Classe: Anticoagulantes (DOACs)", drug: "Apixabano, Edoxabano, Rivaroxabano", rationale: "Prevenção AVC na FA. Use Varfarina apenas em válvulas mecânicas.", loe: "A" },
                { class: "Classe: iSGLT2 (Gliflozinas)", drug: "Dapagliflozina, Empagliflozina", rationale: "Benefício robusto na IC-FEr; benefício emergente na IC-FEp.", loe: "A" },
                { class: "Classe: Bisfosfonatos", drug: "Ácido Alendrónico, Risedronato, Ibandronato", rationale: "Prevenção secundária de fraturas em osteoporose.", loe: "A" },
                { class: "Classe: Estatinas", drug: "Atorvastatina, Rosuvastatina, Sinvastatina", rationale: "Prevenção secundária em doença vascular aterosclerótica.", loe: "A" }
              ],
              biblio: "Referência: STOPP/START criteria version 3 (2023)."
            },
            beers: {
              title: "Critérios Beers 2023",
              subtitle: "Medicamentos potencialmente inapropriados segundo a AGS.",
              color: "bg-amber-600",
              itemBg: "bg-amber-50",
              itemBorder: "border-amber-100",
              items: [
                { class: "Classe: Antiagregantes", drug: "AAS (Aspirina), Clopidogrel", rationale: "Considerar cautela em prevenção primária (>75 anos) pelo risco hemorrágico.", loe: "A" },
                { class: "Classe: Anticoagulantes", drug: "Rivaroxabano, Edoxabano", rationale: "Risco hemorrágico GI aumentado face ao Apixabano no idoso.", loe: "B" },
                { class: "Classe: Antipsicóticos", drug: "Risperidona, Olanzapina, Quetiapina", rationale: "Aumento do risco de AVC e mortalidade em idosos com demência.", loe: "A" },
                { class: "Classe: Hipnóticos (Z-Drugs)", drug: "Zolpidem, Zopiclona, Eszopiclona", rationale: "Risco elevado de quedas, fraturas e delirium.", loe: "A" },
                { class: "Classe: Sulfonilureias", drug: "Glibenclamida, Glimepirida", rationale: "Elevado risco de hipoglicemia grave e prolongada.", loe: "A" }
              ],
              biblio: "Fonte: AGS Beers Criteria® Update (2023)."
            },
            fontes: {
              title: "Fontes e Referências",
              subtitle: "Bases científicas e normas de orientação clínica.",
              color: "bg-slate-900",
              refs: [
                { name: "STOPP/START v3 (2023)", link: "https://doi.org/10.1007/s41999-023-00777-y" },
                { name: "AGS Beers Criteria® (2023)", link: "https://doi.org/10.1111/jgs.18372" },
                { name: "Mendes et al. (2018)", link: "https://doi.org/10.1016/j.regg.2018.04.444" },
                { name: "DGS - NOC Polifarmácia", link: "https://www.dgs.pt" }
              ]
            }
          }), []);

          const nextStep = () => {
            setStep(s => {
              const n = Math.min(s + 1, 5);
              setModal(null);
              return n;
            });
          };
          
          const reset = () => { setStep(1); setModal(null); };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans italic font-black leading-relaxed flex flex-col justify-between">
              <div>
                {/* HEADER INSTITUCIONAL */}
                <nav className="w-full max-w-xl mx-auto bg-white border-b-4 border-indigo-950 sticky top-0 z-50 px-5 py-3 shadow-xl">
                  <div className="flex flex-col gap-3 mb-5 font-black">
                    <div className="flex items-center justify-between">
                      <div className="flex flex-col leading-none shrink-0 font-black">
                         <p className="text-[9px] text-indigo-600 font-black tracking-widest uppercase italic leading-none font-black">FMCB.UALG</p>
                         <p className="text-[13px] text-slate-800 font-black underline decoration-indigo-200 mt-1 leading-none font-black">Sílvia Ramos</p>
                      </div>
                      <div className="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 flex items-center gap-1.5 shadow-sm shrink-0">
                         <Stethoscope size={14} className="text-indigo-600 font-black" />
                         <span className="text-[8px] uppercase tracking-tighter font-black font-black">Apoio Decisão</span>
                      </div>
                    </div>
                    <div className="w-full bg-indigo-950 text-white px-6 py-3 rounded-xl shadow-2xl border-l-4 border-indigo-500 text-center font-black">
                       <h1 className="text-xl font-black uppercase tracking-tighter leading-none italic font-black">Algoritmo 3S</h1>
                    </div>
                  </div>

                  {/* ATALHOS */}
                  <div className="grid grid-cols-4 gap-1.5 text-center font-black">
                    <button onClick={() => setModal("stoppstart")} className="flex flex-col items-center gap-1 p-1.5 bg-indigo-50 border border-indigo-100 rounded-lg shadow-sm transition active:scale-95 font-black">
                       <BookOpen size={12} className="text-indigo-600 font-black font-black" />
                       <span className="text-[7px] uppercase tracking-tighter font-black font-black">STOPP/START</span>
                    </button>
                    <button onClick={() => setModal("beers")} className="flex flex-col items-center gap-1 p-1.5 bg-amber-50 border border-amber-100 rounded-lg shadow-sm transition active:scale-95 font-black">
                       <FileText size={12} className="text-amber-600 font-black font-black" />
                       <span className="text-[7px] uppercase tracking-tighter font-black font-black">Beers 2023</span>
                    </button>
                    <button onClick={() => setModal("fontes")} className="flex flex-col items-center gap-1 p-1.5 bg-emerald-50 border border-emerald-100 rounded-lg shadow-sm transition active:scale-95 font-black">
                       <ExternalLink size={12} className="text-emerald-700 font-black font-black" />
                       <span className="text-[7px] uppercase tracking-tighter font-black font-black">Referências</span>
                    </button>
                    <button onClick={() => setModal("abbrev")} className="flex flex-col items-center gap-1 p-1.5 bg-slate-100 border border-slate-200 rounded-lg shadow-sm transition active:scale-95 font-black">
                       <Hash size={12} className="text-slate-600 font-black font-black" />
                       <span className="text-[7px] uppercase tracking-tighter font-black font-black">Siglas</span>
                    </button>
                  </div>

                  {/* BARRA DE EVOLUÇÃO (ALINHAMENTO EM GRID 5 COLUNAS) */}
                  <div className="mt-6 px-1 font-black">
                     <div className="flex gap-1.5 font-black">
                       {[1, 2, 3, 4, 5].map(i => (
                         <div key={i} className={`h-1.5 rounded-full flex-1 transition-all duration-700 ${i <= step ? STEP_BG_COLORS[i] : "bg-slate-200"}`} />
                       ))}
                     </div>
                     <div className="grid grid-cols-5 mt-2.5 text-[6px] text-slate-400 uppercase tracking-widest font-black italic font-black">
                       {Object.entries(STEP_NAMES).map(([key, name]) => (
                         <div key={key} className={`text-center transition-all ${Number(key) === step ? "text-slate-950 font-black scale-105 font-black" : ""}`}>
                           {key} {name}
                         </div>
                       ))}
                     </div>
                  </div>
                </nav>

                <main className="w-full max-w-xl mx-auto p-5 pb-10 font-black italic">
                  {step < 5 && (
                    <div className="flex flex-col items-center">
                      <div className="mb-10 text-center font-black">
                         <span className="text-xl font-black text-slate-900 uppercase tracking-[0.3em] mb-2 block italic opacity-70">PASSO {step}</span>
                         <h2 className={`text-6xl leading-none font-black italic uppercase tracking-tighter ${STEP_COLORS[step]}`}>
                           {STEP_NAMES[step]}
                         </h2>
                         <p className={`text-base font-black italic uppercase tracking-tight mt-2 ${STEP_COLORS[step]} opacity-80`}>
                           {STEP_SUBTITLES[step]}
                         </p>
                      </div>

                      <div className={`bg-white rounded-[2.5rem] p-10 border-l-[16px] shadow-2xl w-full relative ${STEP_BG_COLORS[step].replace('bg-', 'border-')} font-black`}>
                        <div className="space-y-6 mb-10">
                          {step === 1 ? (
                            <div className="space-y-6">
                              <p className="text-slate-700 text-sm leading-relaxed">
                                O objetivo deste algoritmo é apoiar a revisão da medicação no idoso, identificando potenciais riscos e otimizando a segurança farmacoterapêutica através dos critérios STOPP/START e Beers.
                              </p>
                              <div className="space-y-3 pt-2">
                                {["Idade ≥ 65 anos", "Polifarmácia (≥ 5 fármacos diários)", "Risco de Quedas ou Fragilidade"].map((t, idx) => (
                                  <div key={idx} className="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <span className="text-indigo-600 font-black text-lg">{idx + 1}.</span>
                                    <span className="text-[12px] font-bold">{t}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          ) : (
                            <div className="py-2">
                              <button onClick={() => setModal(STEP_NAMES[step].toLowerCase())} className={`w-full text-white py-8 rounded-3xl text-[15px] font-black uppercase shadow-xl flex items-center justify-center gap-3 transition-all hover:brightness-110 active:scale-95 border-b-4 border-black/10 ${STEP_BG_COLORS[step]}`}>
                                <List size={24} /> Consultar Recomendações Clínicas
                              </button>
                            </div>
                          )}
                        </div>
                        
                        <button onClick={nextStep} className={`w-full py-4 rounded-xl text-white font-black uppercase shadow-lg active:scale-95 transition-all flex flex-col items-center justify-center gap-0 tracking-widest ${STEP_BG_COLORS[step + 1] || 'bg-slate-900'} opacity-90`}>
                           <span className="text-[8px] font-black uppercase opacity-70 tracking-tighter leading-none mb-0.5">Avançar para passo {step + 1}</span>
                           <span className="text-xl font-black uppercase leading-tight">{STEP_NAMES[step + 1]}</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {/* ETAPA DE CONCLUSÃO (VERDE ESMERALDA) */}
                  {step === 5 && (
                    <div className="text-center flex flex-col items-center">
                      <div className="bg-emerald-50 p-8 rounded-full mb-6 border-2 border-emerald-100 shadow-inner">
                         <CheckCircle size={60} className="text-emerald-700" />
                      </div>
                      <h2 className="text-4xl font-black text-slate-900 uppercase italic mb-10 tracking-tighter underline decoration-emerald-700 decoration-4 underline-offset-4">Revisão Concluída</h2>
                      <div className="w-full space-y-6 text-left font-black">
                          <div className="bg-amber-50 border-l-4 border-amber-400 p-6 rounded-xl shadow-sm mb-6 flex items-start gap-4">
                            <AlertTriangle size={24} className="text-amber-500 shrink-0" />
                            <p className="text-[12px] text-amber-900 leading-snug">
                              <strong>JUÍZO CLÍNICO:</strong> A decisão clínica baseada no juízo de valor do profissional prevalece sobre as recomendações deste algoritmo, devendo ser individualizada.
                            </p>
                          </div>
                          <div className="p-10 bg-white rounded-[3rem] border-4 border-emerald-50 shadow-2xl relative">
                              <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-6 italic">Plano de Seguimento:</p>
                              <div className="space-y-6 text-[14px] text-slate-700 italic font-black">
                                  <div className="flex gap-5 items-start">
                                     <div className="p-3 bg-emerald-50 rounded-lg text-emerald-700 shrink-0"><ClipboardCheck size={20} /></div>
                                     <div>
                                        <p className="font-black text-slate-900 uppercase text-[11px] tracking-tight leading-none">Registo Clínico</p>
                                        <p className="text-[12px] text-slate-500 mt-1 leading-snug">Documentar intervenções e fundamentar as alterações terapêuticas.</p>
                                     </div>
                                  </div>
                                  <div className="flex gap-5 items-start">
                                     <div className="p-3 bg-emerald-50 rounded-lg text-emerald-700 shrink-0"><RefreshCw size={20} /></div>
                                     <div>
                                        <p className="font-black text-slate-900 uppercase text-[11px] tracking-tight leading-none">Monitorização</p>
                                        <p className="text-[12px] text-slate-500 mt-1 leading-snug">Avaliar eficácia e segurança em consulta de follow-up.</p>
                                     </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                      <button onClick={reset} className="w-full mt-10 bg-indigo-950 text-white py-7 rounded-2xl font-black uppercase shadow-2xl flex items-center justify-center gap-4 active:scale-95 transition-all">
                         Iniciar Novo Utente <RefreshCw size={18} />
                      </button>
                    </div>
                  )}
                </main>
              </div>

              {/* CURRICULAR DISCLAIMER FOOTER */}
              <footer className="w-full text-center py-4 bg-slate-100 border-t border-slate-200 mt-auto">
                 <p className="text-[10px] uppercase tracking-wider text-slate-500 font-bold font-sans not-italic">
                    Ferramenta teste / Âmbito curricular / Clínicas 2 / Ano 2025/2026
                 </p>
              </footer>

              {/* MODAL SYSTEM */}
              {modal && (
                <div className="fixed inset-0 z-[100] flex flex-col justify-end p-4 bg-black/50 backdrop-blur-md italic font-black">
                  <div className="bg-white w-full max-w-xl mx-auto rounded-[3rem] overflow-hidden flex flex-col shadow-2xl border border-slate-200">
                    {/* CABEÇALHO COM TÍTULO XL E SUBTÍTULO DE CONTEXTO */}
                    <div className={["p-6 text-white flex items-center justify-between", modal === "abbrev" || modal === "fontes" ? "bg-slate-900" : (content[modal]?.color || "bg-indigo-950")].join(" ")}>
                      <div className="flex flex-col gap-0.5">
                         <div className="flex items-center gap-3">
                            <div className="p-1.5 bg-white/20 rounded-lg"><Info size={20} /></div>
                            <h3 className="font-black uppercase text-xl tracking-tight italic">{content[modal]?.title || "Detalhes"}</h3>
                         </div>
                         {content[modal]?.subtitle && (
                           <p className="text-[9px] text-white/80 uppercase tracking-widest font-black italic mt-1 leading-none">
                             {content[modal].subtitle}
                           </p>
                         )}
                      </div>
                      <button onClick={() => setModal(null)} className="p-2 bg-black/20 hover:bg-white/20 rounded-xl transition"><PlusCircle className="w-7 h-7 rotate-45" /></button>
                    </div>
                    
                    <div className="p-10 space-y-6 max-h-[60vh] overflow-y-auto bg-slate-50">
                      {/* SIGLAS */}
                      {modal === "abbrev" && abbreviations.map(a => (
                        <div key={a.s} className="flex gap-6 text-[12px] bg-white p-5 rounded-2xl border border-slate-100 shadow-sm"><span className="text-indigo-600 w-20 uppercase font-black shrink-0"> {a.s}</span><span className="text-slate-500 font-bold">{a.e}</span></div>
                      ))}

                      {/* REFERÊNCIAS */}
                      {modal === "fontes" && content.fontes.refs.map(b => (
                        <div key={b.name} className="p-4 bg-white border border-slate-200 rounded-2xl flex items-center justify-between shadow-sm mb-3 last:mb-0">
                           <div className="flex items-center gap-3">
                              <div className="w-8 h-8 bg-indigo-50 text-indigo-700 rounded-lg flex items-center justify-center text-[9px] font-black border border-indigo-100 italic">REF</div>
                              <div>
                                <p className="text-[10px] text-slate-800 font-black uppercase tracking-tight">{b.name}</p>
                              </div>
                           </div>
                           <a href={b.link} target="_blank" className="p-2 bg-indigo-950 text-white rounded-lg shadow-lg"><ExternalLink size={14} /></a>
                        </div>
                      ))}

                      {/* SWITCH ESPECÍFICO */}
                      {modal === "switch" && content.switch.items.map((item, idx) => (
                        <div key={idx} className="bg-white rounded-[2rem] border-2 border-blue-100 shadow-md overflow-hidden mb-6 last:mb-0">
                           <div className="bg-orange-50 p-6 border-b-2 border-orange-100">
                              <span className="text-[10px] uppercase text-orange-600 font-black block mb-1 tracking-widest italic">Fármaco a avaliar:</span>
                              <p className="text-lg text-orange-700 font-black uppercase leading-tight">{item.evaluate}</p>
                              <p className="text-[12px] text-orange-800 font-black uppercase italic mt-1">{item.evaluateClass}</p>
                           </div>
                           <div className="p-6 space-y-5">
                              <div>
                                <span className="text-[10px] uppercase text-indigo-400 font-black block mb-1 tracking-widest italic">Substituir por:</span>
                                <p className="text-[16px] text-indigo-950 font-black uppercase leading-tight">{item.targetClass}</p>
                              </div>
                              <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                                <span className="text-[10px] uppercase text-indigo-600 font-black block mb-2 italic">Sugestões DCI (Perfis Seguros):</span>
                                <p className="text-[14px] text-indigo-800 font-black italic tracking-tight">{item.examples}</p>
                              </div>
                              <p className="text-[12px] text-slate-600 leading-snug">Racional: {item.rationale}</p>
                           </div>
                        </div>
                      ))}

                      {/* OUTROS PASSOS (STOP, START, BEERS INTEGRAL) */}
                      {modal !== "switch" && modal !== "fontes" && modal !== "abbrev" && modal !== "stoppstart" && content[modal]?.items?.map((item, idx) => (
                        <div key={idx} className={["p-6 rounded-2xl border-2 shadow-sm relative mb-5 last:mb-0", `${content[modal].itemBg} ${content[modal].itemBorder}`].join(" ")}>
                          <div className="flex justify-between items-start mb-4">
                            <p className="font-black text-indigo-950 text-sm uppercase underline decoration-indigo-200 decoration-4 underline-offset-4">{item.class}</p>
                            <span className={`text-[8px] font-black px-2 py-1 rounded-lg uppercase italic ${getLoeColor(item.loe)}`}>Nível de Evidência {item.loe}</span>
                          </div>
                          <div className="mb-4">
                            <p className="text-[14px] text-indigo-700 font-black italic bg-indigo-50/50 p-3 rounded-lg border border-indigo-100/50 tracking-tight leading-snug">DCIs: {item.drug}</p>
                          </div>
                          <p className="text-[12px] text-slate-600 italic leading-snug">Racional: {item.rationale}</p>
                        </div>
                      ))}

                      {/* RESUMO STOPP/START (TOPO) */}
                      {modal === "stoppstart" && content.stoppstart.sections.map((sec, sidx) => (
                        <div key={sidx} className="space-y-4 pt-4 first:pt-0 mb-8 last:mb-0">
                           <h5 className="text-sm font-black text-indigo-950 uppercase tracking-widest border-b-2 border-indigo-100 pb-2 mb-4 italic"> {sec.heading}</h5>
                           {sec.items.map((item, idx) => (
                              <div key={idx} className="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm relative mb-3 last:mb-0">
                                <div className={`absolute top-4 right-4 text-[7px] font-black px-2 py-1 rounded-lg uppercase italic ${getLoeColor(item.loe)}`}>Nível de Evidência {item.loe}</div>
                                <p className="text-sm text-indigo-950 font-black uppercase mb-1">{item.class}</p>
                                <p className="text-[11px] text-indigo-600 italic mb-2 tracking-tight">DCIs: {item.drug}</p>
                                <p className="text-[11px] text-slate-500 leading-tight font-bold">Racional: {item.rationale}</p>
                              </div>
                           ))}
                        </div>
                      ))}

                      {/* RODAPÉ DO CONTEÚDO */}
                      {content[modal]?.biblio && (
                        <div className="mt-8 pt-6 border-t-2 border-slate-200">
                           <p className="text-[8px] uppercase text-slate-400 font-black tracking-widest mb-3 italic">Fonte de Evidência:</p>
                           <div className="p-5 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-2">
                              <p className="text-[11px] text-slate-800 font-black italic leading-tight">{content[modal].biblio}</p>
                              {content[modal].url && (
                                <a href={content[modal].url} target="_blank" className="inline-flex items-center gap-1.5 text-[9px] text-indigo-600 font-black hover:underline italic">
                                  Consultar Referência Original <ExternalLink size={12} />
                                </a>
                              )}
                           </div>
                        </div>
                      )}
                    </div>

                    {/* RODAPÉ DO MODAL COM NAVEGAÇÃO INTEGRADA (AVANÇAR SEM FECHAR) */}
                    <div className="p-8 bg-slate-50 border-t flex flex-col gap-3">
                        {step < 5 && modal !== "stoppstart" && modal !== "fontes" && modal !== "abbrev" && (
                          <button onClick={nextStep} className={`w-full text-white py-5 rounded-2xl uppercase text-[12px] shadow-lg flex items-center justify-center gap-2 transition active:scale-95 ${STEP_BG_COLORS[step + 1] || 'bg-slate-900'}`}>
                            Próximo Passo: {STEP_NAMES[step + 1]} <ArrowRight size={16} />
                          </button>
                        )}
                        <button onClick={() => setModal(null)} className="w-full bg-slate-200 text-slate-600 font-black py-4 rounded-xl uppercase text-[10px] tracking-widest shadow-sm italic transition hover:bg-slate-300">Fechar Detalhes</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Initialize and Mount React Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
